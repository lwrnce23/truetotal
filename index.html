<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E8ECF0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TrueTotal"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>TrueTotal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept: the itemised receipt. Everything you pay for, printed as one bill with a true total.
   Layout: phone first, one column, bottom tabs. Receipt paper on a cool ground, marker highlight on the numbers that matter. */
:root {
  --ground: #E8ECF0;
  --paper: #FFFFFF;
  --paper2: #F3F5F8;
  --ink: #10151B;
  --ink2: #566170;
  --line: #D9DFE6;
  --hi: #D6F55F;
  --hi-ink: #10151B;
  --good: #12915A;
  --warn: #C77700;
  --bad: #DE3A47;
  --k-pay: #F0446B;
  --k-sub: #7A5CFA;
  --k-bill: #2F80ED;
  --k-loan: #E5A100;
  --k-other: #7B8794;
  --k-game: #0E9AA7;
  --k-left: #8FD3B0;
  --fd: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --fb: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fm: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0C0E11; --paper: #171A1F; --paper2: #1F2329; --ink: #EDF0F4; --ink2: #98A2B0; --line: #2B3038;
    --good: #3DD68C; --warn: #F2A93B; --bad: #FF6B74;
    --k-pay: #FF6F8E; --k-sub: #9C86FF; --k-bill: #5AA0FF; --k-loan: #F5BE3A; --k-other: #98A2B0; --k-game: #4FD1D9; --k-left: #2F6B52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0C0E11; --paper: #171A1F; --paper2: #1F2329; --ink: #EDF0F4; --ink2: #98A2B0; --line: #2B3038;
  --good: #3DD68C; --warn: #F2A93B; --bad: #FF6B74;
  --k-pay: #FF6F8E; --k-sub: #9C86FF; --k-bill: #5AA0FF; --k-loan: #F5BE3A; --k-other: #98A2B0; --k-game: #4FD1D9; --k-left: #2F6B52;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--fb);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--fd); letter-spacing: -0.02em; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--fm); font-variant-numeric: tabular-nums; }
small, .sm { font-size: 12.5px; color: var(--ink2); }
.muted { color: var(--ink2); }
.hl { background: linear-gradient(transparent 10%, var(--hi) 10% 90%, transparent 90%); color: var(--hi-ink); padding: 0 .18em; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

.shell { max-width: 480px; margin: 0 auto; padding-bottom: 104px; }
header.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--fd); font-weight: 800; font-size: 21px; letter-spacing: -0.03em; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.icon-btn:hover { background: var(--paper); }
svg.i { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#view { display: flex; flex-direction: column; gap: 16px; }
.pg-title { font-size: 26px; font-weight: 800; line-height: 1.1; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* paper + cards */
.paper { position: relative; background: var(--paper); padding: 20px 18px 24px; margin-bottom: 8px; }
.paper::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; background: conic-gradient(from -45deg at bottom, transparent, var(--paper) 1deg 89deg, transparent 90deg) 50% / 14px 100%; }
.paper::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 8px; background: conic-gradient(from 135deg at top, transparent, var(--paper) 1deg 89deg, transparent 90deg) 50% / 14px 100%; }
.card { background: var(--paper); border-radius: 16px; padding: 16px; }
.eyebrow { font-family: var(--fm); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.rule { border: 0; border-top: 2px dashed var(--line); margin: 14px 0; }
.leader { display: flex; align-items: baseline; gap: 8px; }
.leader .dots { flex: 1; border-bottom: 2px dotted var(--ink2); opacity: .4; transform: translateY(-4px); min-width: 12px; }
.leader .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.leader .amt { font-family: var(--fm); font-weight: 500; white-space: nowrap; }
.ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--paper)); }
.ico svg { width: 15px; height: 15px; }
.ico.lg { width: 38px; height: 38px; border-radius: 12px; }
.ico.lg svg { width: 20px; height: 20px; }
.share { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin: 5px 0 11px; }
.bar { height: 6px; border-radius: 99px; background: var(--paper2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.total-line { font-family: var(--fd); font-weight: 800; font-size: 20px; }
.total-num { font-family: var(--fm); font-weight: 600; font-size: 34px; letter-spacing: -0.03em; }
.stamp { position: absolute; top: 18px; right: 14px; transform: rotate(-9deg); border: 2.5px solid var(--c); color: var(--c); font-family: var(--fm); font-weight: 600; font-size: 12.5px; letter-spacing: .1em; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; animation: slam .5s .6s both cubic-bezier(.2,1.4,.4,1); }
@keyframes slam { from { opacity: 0; transform: rotate(-9deg) scale(2.2); } to { opacity: .95; transform: rotate(-9deg) scale(1); } }
.barcode { height: 26px; margin-top: 18px; opacity: .85; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px); }
.tick { color: var(--ink2); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 99px; background: var(--ink); color: var(--paper); font-family: var(--fd); font-weight: 600; font-size: 15.5px; transition: transform .12s ease; }
.btn:active { transform: scale(.97); }
.btn.hi { background: var(--hi); color: var(--hi-ink); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.sm2 { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 99px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--paper2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-height: 38px; border-radius: 10px; font-weight: 500; font-size: 13.5px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
.sw { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.sw[aria-checked="true"] { background: var(--good); }
.sw[aria-checked="true"]::after { transform: translateX(18px); }
.tapzone { min-width: 48px; min-height: 48px; display: grid; place-items: center; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 600; }
input[type=text], input[type=number], input[type=date], textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; background: var(--paper2); border: 1.5px solid transparent; font-size: 16px; font-family: var(--fb);
}
input:focus, textarea:focus { outline: none; border-color: var(--ink); background: var(--paper); }
input.mono-in { font-family: var(--fm); font-size: 22px; font-weight: 500; }
.money { display: flex; align-items: center; gap: 10px; }
.money span { font-family: var(--fm); font-weight: 600; color: var(--ink2); }
textarea { min-height: 96px; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--ink); height: 32px; }
.range-lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); }

/* list rows */
.group { background: var(--paper); border-radius: 16px; padding: 6px 14px 8px; }
.group-h { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; }
.group-h h3 { font-size: 16px; font-weight: 800; flex: 1; }
.item { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
.group-h + .item { border-top: 0; }
.item .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 0; min-height: 56px; }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; line-height: 1.3; }
.item .tx small { display: block; line-height: 1.35; }
.item .rt { text-align: right; flex: none; min-width: 50px; }
.item .rt b { font-weight: 600; font-size: 15px; display: block; }
.item .rt small { font-size: 11px; }
.item.off { opacity: .42; }
.empty { text-align: center; padding: 34px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--ground) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 8px; min-height: 58px; color: var(--ink2); font-size: 11.5px; font-weight: 600; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"] .pill { background: var(--hi); color: var(--hi-ink); }
nav.tabs .pill { width: 52px; height: 30px; border-radius: 99px; display: grid; place-items: center; transition: background .2s; }

/* donut */
.donut-wrap { position: relative; width: 220px; height: 220px; margin: 4px auto 8px; }
.donut-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.seg-c { fill: none; stroke-width: 28; transition: stroke-dasharray 1s cubic-bezier(.2,.8,.2,1), opacity .2s, stroke-width .2s; cursor: pointer; }
.donut-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 44px; }
.legend { display: flex; flex-direction: column; gap: 2px; }
.lg { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; text-align: left; width: 100%; }
.lg[aria-pressed="true"] { background: var(--paper2); }
.lg .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--c); flex: none; }
.lg .nm { flex: 1; font-weight: 500; }

/* calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-family: var(--fm); font-size: 11px; color: var(--ink2); padding: 4px 0; }
.day { aspect-ratio: 1 / 1.12; border-radius: 10px; background: var(--paper2); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 0 6px; font-family: var(--fm); font-size: 13px; position: relative; }
.day.blank { background: transparent; pointer-events: none; }
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.day .dots { display: flex; gap: 2px; min-height: 6px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.day .amt { font-size: 9.5px; line-height: 1; color: var(--ink); opacity: .75; min-height: 9px; }
.day[aria-pressed="true"] .amt { color: var(--paper); opacity: .8; }
.pay-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.pay-row:first-child { border-top: 0; }
.pay-row .tx { flex: 1; min-width: 0; }
.pay-row b { font-weight: 600; display: block; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 13, .55); opacity: 0; transition: opacity .25s; z-index: 40; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 41; width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--paper); border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 102%); transition: transform .35s cubic-bezier(.2,.9,.2,1); overscroll-behavior: contain; }
.sheet.on { transform: translate(-50%, 0); }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 2px auto 12px; }
.sheet h2 { font-size: 22px; font-weight: 800; }
.preview { background: var(--paper2); border-radius: 14px; padding: 12px 14px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; white-space: nowrap; }
.sheet .sticky { position: sticky; bottom: calc(-22px - env(safe-area-inset-bottom, 0px)); background: var(--paper); padding: 10px 0 calc(22px + env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-22px - env(safe-area-inset-bottom, 0px)); }

/* full-screen flows */
.flow { position: fixed; inset: 0; z-index: 50; background: var(--ground); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.flow .in { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding: 14px 0 calc(22px + env(safe-area-inset-bottom, 0px)); }
.flow .prog { display: flex; align-items: center; gap: 12px; }
.flow .prog .track { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.flow .prog .track i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .4s; }
.flow .body { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.flow .foot { display: flex; flex-direction: column; gap: 8px; }
.flow h1 { font-size: 32px; font-weight: 800; line-height: 1.08; }
.flow h2 { font-size: 24px; font-weight: 800; line-height: 1.15; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; min-height: 56px; border-radius: 14px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 500; }
.opt .k { width: 28px; height: 28px; border-radius: 8px; background: var(--paper2); display: grid; place-items: center; font-family: var(--fm); font-weight: 600; font-size: 13px; flex: none; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.opt[aria-pressed="true"] .k { background: var(--hi); color: var(--hi-ink); }
.opt.right { box-shadow: inset 0 0 0 2px var(--good); }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.note { font-size: 13px; color: var(--ink2); background: var(--paper2); border-radius: 12px; padding: 10px 12px; }

/* reveal */
.rv { display: flex; flex-direction: column; gap: 16px; }
.rv .line { display: flex; gap: 8px; align-items: baseline; opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; }
.rv .line.show { opacity: 1; transform: none; }
.rv .fade { opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .5s; }
.rv .fade.show { opacity: 1; transform: none; }
.cmp { display: grid; gap: 10px; }
.cmp .bar { height: 14px; }
.cmp .bar i { transition-duration: 1.2s; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 99px; font-weight: 600; font-size: 14px; opacity: 0; transition: .3s; z-index: 60; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.steps .stp { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.steps .stp:first-of-type { border-top: 0; }
.steps .num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--fm); background: var(--paper2); color: var(--ink2); }
.steps .stp.done .num { background: var(--good); color: #fff; }
.steps .stp.now .num { background: var(--ink); color: var(--paper); }
.steps .stp.done b { color: var(--ink2); text-decoration: line-through; text-decoration-thickness: 1px; }
.steps .stp p { margin: 1px 0 0; }
@media (min-width: 900px) { #view > .steps { column-span: all; } }
.tipcard { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.tipcard:first-child { border-top: 0; }
.tag { align-self: flex-start; font-family: var(--fm); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; color: var(--c); background: color-mix(in srgb, var(--c) 15%, var(--paper)); white-space: nowrap; margin-top: 2px; flex: none; min-width: 64px; text-align: center; }
.meter { position: relative; height: 12px; border-radius: 99px; background: var(--paper2); overflow: visible; }
.meter i.f { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--c); transition: width 1s cubic-bezier(.2,.8,.2,1); }
.meter i.g { position: absolute; top: -4px; width: 2.5px; height: 20px; background: var(--ink); border-radius: 2px; }
.install { display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 12px 8px 12px 14px; margin-bottom: 12px; }
.install .tx { flex: 1; font-size: 13.5px; line-height: 1.4; }
.install .tx b { font-family: var(--fd); font-size: 15px; display: block; }
.install .btn { background: var(--hi); color: var(--hi-ink); min-height: 38px; padding: 0 16px; font-size: 14px; }
.install .icon-btn:hover { background: transparent; }
.install svg.i { display: inline-block; vertical-align: -4px; }
.ideas { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.ideas li { display: flex; gap: 10px; font-size: 14px; line-height: 1.45; }
.ideas li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink2); margin-top: 8px; flex: none; }
.save-off { opacity: .55; }
.warnbar { background: color-mix(in srgb, var(--warn) 18%, var(--paper)); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
/* colour + motion */

  /* ---------- install prompt (only on the hosted copy, only in a browser tab) ---------- */

  /* ---------- install-first screen (iPhone cannot be installed automatically, so we guide) ---------- */
  function gateEnv() {
    var q = /[?&]gate=(ios|android)/.exec(location.search), ua = navigator.userAgent;
    var ios = q ? q[1] === "ios" : /iphone|ipad|ipod/i.test(ua), android = q ? q[1] === "android" : /android/i.test(ua);

      : deferredInstall ? [] : [["dots", "Open the browser menu", "The three dots at the top right of Chrome."], ["addsq", "Tap Install app or Add to Home screen", "Then open TrueTotal from your home screen."]];
    var h = '<div class="in"><div class="body" style="padding-top:18px"><span class="brand-mark" style="width:54px;height:54px;border-radius:16px">' + ic("receipt", 30) + '</span><h1>Install it <span class="hl">first</span></h1><p class="muted" style="font-size:16px">TrueTotal works best as an app on your home screen. Install it before you start. Your answers are saved inside whichever one you use, so starting in the browser would not carry over.</p>';
    if (e.inapp) h += '<div class="warnbar"><b>You are in an app\'s built-in browser.</b> Installing does not work here. Tap the compass or ⋯ button and choose ' + b("Open in Safari") + ", or copy the link below and paste it into Safari.</div>";
    h += steps.map(function (s, i) { return '<div class="card" style="display:flex;gap:14px;align-items:center"><span class="ico lg" style="--c:var(--ink)">' + ic(s[0], 22) + '</span><div><b style="font-family:var(--fd);font-size:16px">' + (i + 1) + ". " + s[1] + '</b><p class="sm" style="margin-top:2px">' + s[2] + "</p></div></div>"; }).join("");
    h += '</div><div class="foot">' + (deferredInstall && !e.ios ? '<button class="btn hi block" data-act="gateinstall">Install TrueTotal</button>' : "") + '<button class="btn ghost block" data-act="copylink">Copy the link</button><button class="btn ghost block" data-act="gateskip">Skip, use it in the browser</button></div></div>';
    if (!flowEl) { flowEl = document.createElement("div"); flowEl.className = "flow"; flowEl.setAttribute("role", "dialog"); flowEl.setAttribute("aria-modal", "true"); flowEl.setAttribute("aria-label", "TrueTotal"); flowEl.setAttribute("tabindex", "-1"); document.body.appendChild(flowEl); }

  applyTheme();
  render();
  if (!S.onboarded) { if (shouldGate()) openGate(); else openFlow("onboard"); }
})();
